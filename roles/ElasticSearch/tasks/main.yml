---

- name: Create directory for installation
  ansible.builtin.file:
    path: "{{ elastic_dir }}"
    state: directory

- name: Download the signing key
  become: true
  ansible.builtin.get_url:
    url: "{{ signkey_url }}"
    dest: "{{ elastic_dir }}"
  when: ansible_distribution == "Ubuntu"

- name: Extract gpg key
  become: true
  ansible.builtin.command:
    cmd: gpg --dearmor --output /usr/share/keyrings/elasticsearch-keyring.gpg "{{ elastic_dir }}"
    creates: /usr/share/keyrings/elasticsearch-keyring.gpg
  when: ansible_distribution == "Ubuntu"

- name: Import Signing Key for CentOS
  become: true
  ansible.builtin.rpm_key:
    key: "{{ signkey_url }}"
    state: present
  when: ansible_distribution == "CentOS"

- name: Download Elastic Search deb pkg
  ansible.builtin.get_url:
    url: "{{ debpkg_link }}"
    dest: "{{ elastic_dir }}"
    checksum: "sha512:{{ debpkg_chksum }}"
  when: ansible_distribution == "Ubuntu"

- name: Download Elastic Search rpm pkg
  ansible.builtin.get_url:
    url: " {{ rpmpkg_link }}"
    dest: "{{ elastic_dir }}"
    checksum: "sha512:{{ rpmpkg_chksum }}"
  when: ansible_distribution == "CentOS"

- name: Install from deb pkg
  tags: install
  become: true
  ansible.builtin.apt:
    deb: "{{ deb_elastic }}"
  when: ansible_distribution == "Ubuntu"

- name: Install from rpm pkg
  tags: install
  become: true
  ansible.builtin.dnf:
    name: "{{ rpm_elastic }}"
    state: present
  when: ansible_distribution == "CentOS"

- name: Configure the elasticsearch.yml for both hosts
  tags: config
  become: true
  ansible.builtin.blockinfile:
    path: /etc/elasticsearch/elasticsearch.yml
    block: |
      cluster.name: my-cluster
      network.host: 0.0.0.0
      transport.host: 0.0.0.0
      action.auto_create_index: .monitoring*,.watches,.triggered_watches,.watcher-history*,.ml*
    marker: "# {mark} ANSIBLE MANAGED ELASTICSEARCH CONFIG"
  when: ansible_distribution == "Ubuntu"

- name: Generate Elasticsearch enrollment token
  tags: enroll
  become: true
  ansible.builtin.command:
    cmd: /usr/share/elasticsearch/bin/elasticsearch-create-enrollment-token -s node
  register: enrollment_token_result
  changed_when: true
  when: ansible_distribution == "Ubuntu"

- name: Store Elasticsearch enrollment token
  tags: enroll
  become: true
  ansible.builtin.set_fact:
    elasticsearch_enrollment_token: "{{ enrollment_token_result.stdout | trim }}"
  when: ansible_distribution == "Ubuntu"

- name: Enroll Elasticsearch node
  tags: enroll
  become: true
  ansible.builtin.command:
    cmd: >
      /usr/share/elasticsearch/bin/elasticsearch-reconfigure-node
      --enrollment-token "{{ hostvars[groups['web_servers'][0]]['elasticsearch_enrollment_token'] }}"
  when: ansible_distribution == "CentOS"

- name: Start the elasticsearch service
  tags: start
  become: true
  ansible.builtin.service:
    name: elasticsearch
    state: started
    enabled: true

- name: Reload systemd daemon
  tags: reload
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
